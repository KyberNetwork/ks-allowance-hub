[profile.default]
optimizer = true
optimizer_runs = 44_444_444
fs_permissions = [{ access = "read-write", path = "./" }]
verbosity = 3
via_ir = true
dynamic_test_linking = true
ffi = true
bytecode_hash = "none"

additional_compiler_profiles = [
    { name = "runs-20000", via_ir = true, optimizer_runs = 20000 },
]

compilation_restrictions = [
    { paths = "src/v2/KSAllowanceHubV2.sol", optimizer_runs = 20000 },
]

# Solar build of the same sources. From 10,000 optimizer runs solar inlines enough to put the hub
# over the EIP-170 limit, so the hub is compiled at 7,500. Run with `FOUNDRY_PROFILE=solar`.
[profile.solar]
solc = "solar"

additional_compiler_profiles = [
    { name = "runs-7500", via_ir = true, optimizer_runs = 7_500 },
]

compilation_restrictions = [
    { paths = "src/v2/KSAllowanceHubV2.sol", optimizer_runs = 7_500 },
]


[fuzz]
runs = 32

# Local deep-fuzz profile. Inherits everything from `default` and only raises the fuzz budget, so
# it exercises the same build as CI. Run with `FOUNDRY_PROFILE=deep forge test`.
[profile.deep.fuzz]
runs = 1_000

[fmt]
line_length = 100
tab_width = 2
quote_style = 'single'
number_underscore = 'thousands'
sort_imports = true
single_line_statement_blocks = 'multi'

[lint]
lint_on_build = false

[rpc_endpoints]
mainnet = "${RPC_1}"
bsc_mainnet = "${RPC_56}"
polygon_mainnet = "${RPC_137}"
avalanche_mainnet = "${RPC_43114}"
arbitrum_mainnet = "${RPC_42161}"
optimism_mainnet = "${RPC_10}"
linea_mainnet = "${RPC_59144}"
base_mainnet = "${RPC_8453}"
mantle_mainnet = "${RPC_5000}"
bera_mainnet = "${RPC_80094}"
ronin_mainnet = "${RPC_2020}"
uni_mainnet = "${RPC_130}"
etherlink_mainnet = "${RPC_42793}"
plasma_mainnet = "${RPC_9745}"
hyperevm_mainnet = "${RPC_999}"
sonic_mainnet = "${RPC_146}"
monad_mainnet = "${RPC_143}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[bind_json]
include = ['**/src/v2/types/*.sol', '**/src/v2/authenticators/types/*.sol', '**/src/base/types/*.sol']
