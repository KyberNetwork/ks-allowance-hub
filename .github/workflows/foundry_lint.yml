name: Run Foundry Lint

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Run Foundry Lint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install Foundry
        uses: KyberNetwork/foundry-toolchain@master
        with:
          version: v1.8.3
          cache: false

      - name: Run Forge Lint
        id: lint
        run: forge fmt --check

      - name: Check the EIP-712 bindings are current
        run: |
          forge bind-json
          git diff --exit-code utils/JsonBindings.sol
