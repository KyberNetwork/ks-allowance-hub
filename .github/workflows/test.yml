name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

env:
  RPC_137: ${{ secrets.RPC_137 }}
  RPC_1: ${{ secrets.RPC_1 }}
  RPC_42161: ${{ secrets.RPC_42161 }}
  RPC_10: ${{ secrets.RPC_10 }}
  RPC_43114: ${{ secrets.RPC_43114 }}
  RPC_56: ${{ secrets.RPC_56 }}
  RPC_59144: ${{ secrets.RPC_59144 }}
  RPC_8453: ${{ secrets.RPC_8453 }}
  RPC_146: ${{ secrets.RPC_146 }}
  RPC_80094: ${{ secrets.RPC_80094 }}
  RPC_2020: ${{ secrets.RPC_2020 }}
  RPC_5000: ${{ secrets.RPC_5000 }}
  RPC_143: ${{ secrets.RPC_143 }}

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          # lib/ks-action-validator-sc is a private repo, so the default GITHUB_TOKEN cannot
          # clone it. The PAT is used for the submodule fetch and dropped afterwards, since
          # persist-credentials stays false.
          token: ${{ secrets.GH_PAT }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build src --sizes

      - name: Run Forge tests
        run: forge test -vvv --isolate
