name: Run Foundry Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Run Foundry Build

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install Foundry
        uses: KyberNetwork/foundry-toolchain@master
        with:
          version: v1.9.0
          cache: false

      - name: Run Forge Build for v1
        id: build-v1
        run: |
          forge --version
          forge build src/v1 --sizes

      - name: Run Forge Build for v2 with solar
        id: build-v2
        run: FOUNDRY_PROFILE=solar forge build src/v2 --sizes

      # The bound types all live under `src/v2` and `src/base`, which the step above has compiled
      - name: Check the EIP-712 bindings are current
        run: |
          FOUNDRY_PROFILE=solar forge bind-json
          git diff --exit-code utils/JsonBindings.sol
